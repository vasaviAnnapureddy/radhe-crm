# Used only inside Docker. Same idea as Vite's proxy and the Vercel rewrite:
# the browser talks to one address, and /api is passed on to the backend.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Any other address is a page of the React app (for example /console/overview).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
