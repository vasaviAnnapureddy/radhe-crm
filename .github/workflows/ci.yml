# Runs on every push: tests, a production build, and a full Docker start with a health check.
# It proves the project builds and runs on a clean machine. It never touches the live site or its database.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start everything
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: The API answers and can reach its database
        run: curl --fail --silent http://localhost:8080/api/health | grep '"database":"ok"'
      - name: The demo data was loaded (the local demo admin can sign in)
        run: |
          curl --fail --silent -X POST http://localhost:8080/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@radhe.local","password":"radhe-admin-demo"}' | grep '"role":"admin"'
      - name: The landing page is served
        run: curl --fail --silent --output /dev/null http://localhost:8080/
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --tail 80
      - name: Stop
        if: always()
        run: docker compose down -v
