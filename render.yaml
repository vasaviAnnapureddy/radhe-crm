# Render "Blueprint": tells Render how to run the backend. See docs/DEPLOYMENT.md.
# TODO: verify field names against https://render.com/docs/blueprint-spec before the first deploy.
services:
  - type: web
    name: radhe-console-api
    runtime: python
    plan: free            # sleeps after about 15 minutes without traffic; see docs/DEPLOYMENT.md
    region: singapore     # close to India and to the Neon database
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --timeout-keep-alive 120: Render's router keeps connections to the app open and reuses them.
    # Uvicorn's default is to close an idle connection after only 5 seconds. When the router then
    # reused a connection the app had just closed, the visitor got a random "502". Keeping
    # connections open longer than the router does removes that.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      # Secrets: typed into the Render dashboard by hand, never stored in this file.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
